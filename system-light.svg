<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="System map: clients call an API layer. Requests are answered from cache and database inside a time limit. Slow work goes to a queue, then workers and AI workflows, and validated results are written back.">
  <title>How I wire a production AI system</title>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .ga { animation: driftA 14s ease-in-out infinite alternate; }
    .gb { animation: driftB 16s ease-in-out infinite alternate; }
    @keyframes driftA { from { transform: translate(0px, 0px); } to { transform: translate(90px, 40px); } }
    @keyframes driftB { from { transform: translate(0px, 0px); } to { transform: translate(-110px, -50px); } }
  </style>
  <defs>
    <linearGradient id="bgs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient>
    <radialGradient id="gas"><stop offset="0" stop-color="#2563EB" stop-opacity="0.22"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
    <radialGradient id="gbs"><stop offset="0" stop-color="#14B8A6" stop-opacity="0.20"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
    <pattern id="dotss" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#CBD5E1"/></pattern>
    <linearGradient id="fades" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.55" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="ms"><rect width="1200" height="480" fill="url(#fades)"/></mask>
    <clipPath id="clips"><rect x="1" y="1" width="1198" height="478" rx="22"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1198" height="478" rx="22" fill="url(#bgs)" stroke="#E2E8F0" stroke-width="2"/>
  <g clip-path="url(#clips)">
    <circle class="ga" cx="144" cy="-20" r="456" fill="url(#gas)"/>
    <circle class="gb" cx="1104" cy="510" r="456" fill="url(#gbs)"/>
    <rect width="1200" height="480" fill="url(#dotss)" mask="url(#ms)"/>
  </g>
  <g fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round">
    <path d="M206,212 L262,212"/>
    <path d="M432,212 C472,212 460,112 500,112"/><path d="M670,112 L738,112"/>
    <path d="M432,212 C472,212 460,312 500,312"/><path d="M670,312 L738,312"/><path d="M908,312 L976,312"/>
    <path d="M1060,270 L1060,134 Q1060,112 1038,112 L916,112"/>
  </g>
  <g fill="#CBD5E1"><path d="M908,112 l12,-7 v14 z"/></g>
  <circle r="5.5" fill="#2563EB"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M206,212 L432,212 C472,212 460,112 500,112 L738,112"/></circle><circle r="5.5" fill="#2563EB"><animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" path="M206,212 L432,212 C472,212 460,112 500,112 L738,112"/></circle><circle r="5.5" fill="#2563EB"><animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite" path="M206,212 L432,212 C472,212 460,112 500,112 L738,112"/></circle><circle r="5.5" fill="#0D9488"><animateMotion dur="6.5s" begin="0.3s" repeatCount="indefinite" path="M206,212 L432,212 C472,212 460,312 500,312 L1060,312 L1060,134 Q1060,112 1038,112 L908,112"/></circle><circle r="5.5" fill="#0D9488"><animateMotion dur="6.5s" begin="2.5s" repeatCount="indefinite" path="M206,212 L432,212 C472,212 460,312 500,312 L1060,312 L1060,134 Q1060,112 1038,112 L908,112"/></circle><circle r="5.5" fill="#0D9488"><animateMotion dur="6.5s" begin="4.6s" repeatCount="indefinite" path="M206,212 L432,212 C472,212 460,312 500,312 L1060,312 L1060,134 Q1060,112 1038,112 L908,112"/></circle>
  <rect x="56" y="170" width="150" height="84" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="131.0" y="207" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#0F172A">Clients</text>
    <text x="131.0" y="231" text-anchor="middle" class="m" font-size="13" fill="#64748B">web · mobile</text><rect x="262" y="170" width="170" height="84" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="347.0" y="207" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#0F172A">API layer</text>
    <text x="347.0" y="231" text-anchor="middle" class="m" font-size="13" fill="#64748B">auth · validation</text><rect x="500" y="70" width="170" height="84" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="585.0" y="107" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#0F172A">Cache</text>
    <text x="585.0" y="131" text-anchor="middle" class="m" font-size="13" fill="#64748B">hot reads</text><rect x="738" y="70" width="170" height="84" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="823.0" y="107" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#0F172A">Database</text>
    <text x="823.0" y="131" text-anchor="middle" class="m" font-size="13" fill="#64748B">source of truth</text><rect x="500" y="270" width="170" height="84" rx="14" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <text x="585.0" y="307" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#0F172A">Queue</text>
    <text x="585.0" y="331" text-anchor="middle" class="m" font-size="13" fill="#64748B">status · retry</text><rect x="738" y="270" width="170" height="84" rx="14" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <text x="823.0" y="307" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#0F172A">Workers</text>
    <text x="823.0" y="331" text-anchor="middle" class="m" font-size="13" fill="#64748B">long-running jobs</text><rect x="976" y="270" width="168" height="84" rx="14" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <text x="1060.0" y="307" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#0F172A">AI workflows</text>
    <text x="1060.0" y="331" text-anchor="middle" class="m" font-size="13" fill="#64748B">agents · RAG</text>
  <text x="58" y="92" class="m" font-size="14" font-weight="600" fill="#0F766E" letter-spacing="2.5">SYSTEM MAP</text>
  <text x="58" y="126" class="s" font-size="23" font-weight="700" fill="#0F172A">How I wire a production AI system</text>
  <circle cx="64" cy="304" r="6" fill="#2563EB"/><text x="80" y="309" class="s" font-size="16" font-weight="700" fill="#0F172A">Request path</text>
  <text x="80" y="330" class="s" font-size="14.5" fill="#64748B">answers inside a time limit, hot reads from cache</text>
  <circle cx="64" cy="356" r="6" fill="#0D9488"/><text x="80" y="361" class="s" font-size="16" font-weight="700" fill="#0F172A">Background work</text>
  <text x="80" y="382" class="s" font-size="14.5" fill="#64748B">slow jobs wait on a queue, never on the user</text>
  <text x="1076" y="196" class="m" font-size="13" fill="#64748B">validated</text><text x="1076" y="213" class="m" font-size="13" fill="#64748B">results</text>
  <rect x="500" y="388" width="644" height="52" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="524" y="420" class="s" font-size="16" font-weight="700" fill="#0F172A">Runs on</text>
  <text x="1120" y="420" text-anchor="end" class="m" font-size="14" fill="#64748B">CI/CD · monitoring · secrets · access control</text>
</svg>
