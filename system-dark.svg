<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="System map: clients call an API layer. Requests are answered from cache and database inside a time limit. Slow work goes to a queue, then workers and AI workflows, and validated results are written back.">
  <title>How I wire a production AI system</title>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .ga { animation: driftA 14s ease-in-out infinite alternate; }
    .gb { animation: driftB 16s ease-in-out infinite alternate; }
    @keyframes driftA { from { transform: translate(0px, 0px); } to { transform: translate(90px, 40px); } }
    @keyframes driftB { from { transform: translate(0px, 0px); } to { transform: translate(-110px, -50px); } }
  </style>
  <defs>
    <linearGradient id="bgs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
    <radialGradient id="gas"><stop offset="0" stop-color="#2563EB" stop-opacity="0.50"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
    <radialGradient id="gbs"><stop offset="0" stop-color="#14B8A6" stop-opacity="0.38"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
    <pattern id="dotss" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#334155"/></pattern>
    <linearGradient id="fades" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.55" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="ms"><rect width="1200" height="480" fill="url(#fades)"/></mask>
    <clipPath id="clips"><rect x="1" y="1" width="1198" height="478" rx="22"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1198" height="478" rx="22" fill="url(#bgs)" stroke="#1E293B" stroke-width="2"/>
  <g clip-path="url(#clips)">
    <circle class="ga" cx="144" cy="-20" r="456" fill="url(#gas)"/>
    <circle class="gb" cx="1104" cy="510" r="456" fill="url(#gbs)"/>
    <rect width="1200" height="480" fill="url(#dotss)" mask="url(#ms)"/>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round">
    <path d="M206,212 L262,212"/>
    <path d="M432,212 C472,212 460,112 500,112"/><path d="M670,112 L738,112"/>
    <path d="M432,212 C472,212 460,312 500,312"/><path d="M670,312 L738,312"/><path d="M908,312 L976,312"/>
    <path d="M1060,270 L1060,134 Q1060,112 1038,112 L916,112"/>
  </g>
  <g fill="#334155"><path d="M908,112 l12,-7 v14 z"/></g>
  <circle r="5.5" fill="#3B82F6"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M206,212 L432,212 C472,212 460,112 500,112 L738,112"/></circle><circle r="5.5" fill="#3B82F6"><animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" path="M206,212 L432,212 C472,212 460,112 500,112 L738,112"/></circle><circle r="5.5" fill="#3B82F6"><animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite" path="M206,212 L432,212 C472,212 460,112 500,112 L738,112"/></circle><circle r="5.5" fill="#2DD4BF"><animateMotion dur="6.5s" begin="0.3s" repeatCount="indefinite" path="M206,212 L432,212 C472,212 460,312 500,312 L1060,312 L1060,134 Q1060,112 1038,112 L908,112"/></circle><circle r="5.5" fill="#2DD4BF"><animateMotion dur="6.5s" begin="2.5s" repeatCount="indefinite" path="M206,212 L432,212 C472,212 460,312 500,312 L1060,312 L1060,134 Q1060,112 1038,112 L908,112"/></circle><circle r="5.5" fill="#2DD4BF"><animateMotion dur="6.5s" begin="4.6s" repeatCount="indefinite" path="M206,212 L432,212 C472,212 460,312 500,312 L1060,312 L1060,134 Q1060,112 1038,112 L908,112"/></circle>
  <rect x="56" y="170" width="150" height="84" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <text x="131.0" y="207" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#F1F5F9">Clients</text>
    <text x="131.0" y="231" text-anchor="middle" class="m" font-size="13" fill="#94A3B8">web · mobile</text><rect x="262" y="170" width="170" height="84" rx="14" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
    <text x="347.0" y="207" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#F1F5F9">API layer</text>
    <text x="347.0" y="231" text-anchor="middle" class="m" font-size="13" fill="#94A3B8">auth · validation</text><rect x="500" y="70" width="170" height="84" rx="14" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
    <text x="585.0" y="107" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#F1F5F9">Cache</text>
    <text x="585.0" y="131" text-anchor="middle" class="m" font-size="13" fill="#94A3B8">hot reads</text><rect x="738" y="70" width="170" height="84" rx="14" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
    <text x="823.0" y="107" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#F1F5F9">Database</text>
    <text x="823.0" y="131" text-anchor="middle" class="m" font-size="13" fill="#94A3B8">source of truth</text><rect x="500" y="270" width="170" height="84" rx="14" fill="#0F172A" stroke="#2DD4BF" stroke-width="2"/>
    <text x="585.0" y="307" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#F1F5F9">Queue</text>
    <text x="585.0" y="331" text-anchor="middle" class="m" font-size="13" fill="#94A3B8">status · retry</text><rect x="738" y="270" width="170" height="84" rx="14" fill="#0F172A" stroke="#2DD4BF" stroke-width="2"/>
    <text x="823.0" y="307" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#F1F5F9">Workers</text>
    <text x="823.0" y="331" text-anchor="middle" class="m" font-size="13" fill="#94A3B8">long-running jobs</text><rect x="976" y="270" width="168" height="84" rx="14" fill="#0F172A" stroke="#2DD4BF" stroke-width="2"/>
    <text x="1060.0" y="307" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#F1F5F9">AI workflows</text>
    <text x="1060.0" y="331" text-anchor="middle" class="m" font-size="13" fill="#94A3B8">agents · RAG</text>
  <text x="58" y="92" class="m" font-size="14" font-weight="600" fill="#2DD4BF" letter-spacing="2.5">SYSTEM MAP</text>
  <text x="58" y="126" class="s" font-size="23" font-weight="700" fill="#F1F5F9">How I wire a production AI system</text>
  <circle cx="64" cy="304" r="6" fill="#3B82F6"/><text x="80" y="309" class="s" font-size="16" font-weight="700" fill="#F1F5F9">Request path</text>
  <text x="80" y="330" class="s" font-size="14.5" fill="#94A3B8">answers inside a time limit, hot reads from cache</text>
  <circle cx="64" cy="356" r="6" fill="#2DD4BF"/><text x="80" y="361" class="s" font-size="16" font-weight="700" fill="#F1F5F9">Background work</text>
  <text x="80" y="382" class="s" font-size="14.5" fill="#94A3B8">slow jobs wait on a queue, never on the user</text>
  <text x="1076" y="196" class="m" font-size="13" fill="#94A3B8">validated</text><text x="1076" y="213" class="m" font-size="13" fill="#94A3B8">results</text>
  <rect x="500" y="388" width="644" height="52" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <text x="524" y="420" class="s" font-size="16" font-weight="700" fill="#F1F5F9">Runs on</text>
  <text x="1120" y="420" text-anchor="end" class="m" font-size="14" fill="#94A3B8">CI/CD · monitoring · secrets · access control</text>
</svg>
