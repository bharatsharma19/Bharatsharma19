<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Bharat Sharma. Technical Lead, Full-Stack Engineer, AI Systems.">
  <title>Bharat Sharma. Technical Lead, Full-Stack Engineer, AI Systems.</title>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .ga { animation: driftA 14s ease-in-out infinite alternate; }
    .gb { animation: driftB 16s ease-in-out infinite alternate; }
    @keyframes driftA { from { transform: translate(0px, 0px); } to { transform: translate(90px, 40px); } }
    @keyframes driftB { from { transform: translate(0px, 0px); } to { transform: translate(-110px, -50px); } }
  </style>
  <defs>
    <linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient>
    <radialGradient id="gah"><stop offset="0" stop-color="#2563EB" stop-opacity="0.22"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
    <radialGradient id="gbh"><stop offset="0" stop-color="#14B8A6" stop-opacity="0.20"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
    <pattern id="dotsh" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#CBD5E1"/></pattern>
    <linearGradient id="fadeh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.55" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="mh"><rect width="1200" height="420" fill="url(#fadeh)"/></mask>
    <clipPath id="cliph"><rect x="1" y="1" width="1198" height="418" rx="22"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1198" height="418" rx="22" fill="url(#bgh)" stroke="#E2E8F0" stroke-width="2"/>
  <g clip-path="url(#cliph)">
    <circle class="ga" cx="144" cy="-20" r="399" fill="url(#gah)"/>
    <circle class="gb" cx="1104" cy="450" r="399" fill="url(#gbh)"/>
    <rect width="1200" height="420" fill="url(#dotsh)" mask="url(#mh)"/>
  </g>
  <defs><linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F172A"/><stop offset="0.6" stop-color="#1D4ED8"/><stop offset="1" stop-color="#0D9488"/></linearGradient></defs>
  <text x="58" y="112" class="m" font-size="15" font-weight="600" fill="#0F766E" textLength="560" lengthAdjust="spacing">TECHNICAL LEAD · FULL-STACK ENGINEER · AI SYSTEMS</text>
  <text x="54" y="208" class="s" font-size="88" font-weight="800" fill="url(#name)" textLength="600" lengthAdjust="spacingAndGlyphs">Bharat Sharma</text>
  <text x="58" y="262" class="s" font-size="24" fill="#475569">Production AI systems, built and kept running.</text>
  <rect x="56" y="300" width="138" height="40" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="125.0" y="325.5" text-anchor="middle" class="s" font-size="15.5" font-weight="600" fill="#334155">AI systems</text><rect x="206" y="300" width="196" height="40" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="304.0" y="325.5" text-anchor="middle" class="s" font-size="15.5" font-weight="600" fill="#334155">Backend platforms</text><rect x="414" y="300" width="196" height="40" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="512.0" y="325.5" text-anchor="middle" class="s" font-size="15.5" font-weight="600" fill="#334155">Cloud and delivery</text>
  <g>
    <rect x="720" y="66" width="424" height="290" rx="14" fill="#020617" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="744" cy="87" r="5.5" fill="#FF5F57"/><circle cx="764" cy="87" r="5.5" fill="#FEBC2E"/><circle cx="784" cy="87" r="5.5" fill="#28C840"/>
    <text x="932.0" y="92" text-anchor="middle" class="m" font-size="13" fill="#64748B">bharat@prod: ~</text>
    <line x1="720" y1="108" x2="1144" y2="108" stroke="#1E293B" stroke-width="1.5"/>
    <clipPath id="c1"><rect x="744" y="118" height="28" width="95"><animate attributeName="width" calcMode="discrete" dur="6.0s" begin="0s" fill="freeze" values="0;12;22;32;42;53;63;73;95;95" keyTimes="0;0.0792;0.0917;0.1042;0.1167;0.1292;0.1417;0.1542;0.1667;1"/></rect></clipPath>
    <g clip-path="url(#c1)"><text x="746" y="138" class="m" font-size="17"><tspan fill="#2DD4BF">$ </tspan><tspan fill="#F1F5F9">whoami</tspan></text></g>
    <g><text x="746" y="165" class="m" font-size="17" fill="#94A3B8" font-weight="400">technical lead · full-stack engineer</text><animate attributeName="opacity" calcMode="discrete" dur="6.0s" begin="0s" fill="freeze" values="0;1;1" keyTimes="0;0.2000;1"/></g>
    <clipPath id="c2"><rect x="744" y="183" height="28" width="167"><animate attributeName="width" calcMode="discrete" dur="6.0s" begin="0s" fill="freeze" values="0;12;22;32;42;53;63;73;83;93;104;114;124;134;144;167;167" keyTimes="0;0.3089;0.3178;0.3267;0.3356;0.3444;0.3533;0.3622;0.3711;0.3800;0.3889;0.3978;0.4067;0.4156;0.4244;0.4333;1"/></rect></clipPath>
    <g clip-path="url(#c2)"><text x="746" y="203" class="m" font-size="17"><tspan fill="#2DD4BF">$ </tspan><tspan fill="#F1F5F9">cat focus.txt</tspan></text></g>
    <g><text x="746" y="230" class="m" font-size="17" fill="#94A3B8" font-weight="400">ai systems · backend · cloud</text><animate attributeName="opacity" calcMode="discrete" dur="6.0s" begin="0s" fill="freeze" values="0;1;1" keyTimes="0;0.4667;1"/></g>
    <clipPath id="c3"><rect x="744" y="248" height="28" width="146"><animate attributeName="width" calcMode="discrete" dur="6.0s" begin="0s" fill="freeze" values="0;12;22;32;42;53;63;73;83;93;104;114;124;146;146" keyTimes="0;0.5769;0.5872;0.5974;0.6077;0.6179;0.6282;0.6385;0.6487;0.6590;0.6692;0.6795;0.6897;0.7000;1"/></rect></clipPath>
    <g clip-path="url(#c3)"><text x="746" y="268" class="m" font-size="17"><tspan fill="#2DD4BF">$ </tspan><tspan fill="#F1F5F9">echo $MOTTO</tspan></text></g>
    <g><text x="746" y="295" class="m" font-size="17" fill="#5EEAD4" font-weight="600">keep production boring</text><animate attributeName="opacity" calcMode="discrete" dur="6.0s" begin="0s" fill="freeze" values="0;1;1" keyTimes="0;0.7333;1"/></g>
    <g><text x="746" y="333" class="m" font-size="17" fill="#2DD4BF">$</text><animate attributeName="opacity" calcMode="discrete" dur="6.0s" begin="0s" fill="freeze" values="0;1;1" keyTimes="0;0.8000;1"/></g>
    <g><rect x="767" y="317" width="10" height="20" fill="#E2E8F0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></rect><animate attributeName="opacity" calcMode="discrete" dur="6.0s" begin="0s" fill="freeze" values="0;1;1" keyTimes="0;0.8000;1"/></g>
  </g>
